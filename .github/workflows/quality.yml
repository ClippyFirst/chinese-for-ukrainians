name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
      - name: Generate canonical maps and Python package data
        run: npm run generate:data
      - name: Verify generated files are committed and deterministic
        run: git diff --exit-code -- src/generated/transcription-map.js python/src/zhua/data/zh-in-ua.csv python/src/zhua/data/traditional-to-simplified.json
      - name: Probe public PyPI project-name endpoints (diagnostic only)
        run: python scripts/check-pypi-project-names.py
      - name: Build and install Python wheel in a clean virtual environment
        run: |
          python -m venv /tmp/zhua-wheel-venv
          /tmp/zhua-wheel-venv/bin/python -m pip install --upgrade pip build
          /tmp/zhua-wheel-venv/bin/python -m build python --outdir /tmp/zhua-dist
          /tmp/zhua-wheel-venv/bin/python -c "import glob,zipfile; w=glob.glob('/tmp/zhua-dist/*.whl')[0]; z=zipfile.ZipFile(w); assert 'zhua/data/zh-in-ua.csv' in z.namelist(); assert 'zhua/data/traditional-to-simplified.json' in z.namelist(); assert 'zhua/data/pronunciation-overrides.json' in z.namelist(); assert 'zhua/__init__.py' in z.namelist(); assert any(n.endswith('THIRD_PARTY_NOTICES.md') for n in z.namelist()); print(z.namelist())"
          /tmp/zhua-wheel-venv/bin/python -m pip install /tmp/zhua-dist/*.whl
          cd /tmp
          /tmp/zhua-wheel-venv/bin/python -c "import zhua; r=zhua.convert('你好'); assert r.pinyin == 'nǐ hǎo'; print(r.pinyin, r.ipa)"
          /tmp/zhua-wheel-venv/bin/chuktrans --json "你好" > /tmp/zhua-smoke.json
          /tmp/zhua-wheel-venv/bin/python -c "import json; d=json.load(open('/tmp/zhua-smoke.json')); assert d['source']=='你好'"
      - name: Upload built Python distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhua-python-distributions
          path: /tmp/zhua-dist/*
          if-no-files-found: warn
          retention-days: 7
      - name: Install Python package and test dependencies
        run: python -m pip install -e "python[test]"
      - name: Run Python package tests
        run: python -m pytest -q python/tests
      - name: Run JavaScript unit and integration tests
        run: npm test
      - name: Run research benchmark corpus validator regression tests
        run: node tests/research-benchmark-validator.test.mjs
      - name: Validate benchmark corpus structure and scoring guardrails
        run: npm run validate:benchmark-corpus
      - name: Validate acoustic measurement pipeline input guards
        run: python research/ipa-acoustic/test_measure_formants.py
      - name: Build production bundle
        run: npm run build
      - name: Verify generated mappings are deterministic
        run: git diff --exit-code -- src/generated/transcription-map.js python/src/zhua/data/zh-in-ua.csv
      - name: Run conversion benchmark
        run: npm run benchmark
      - name: Check release constraints
        run: npm run check:release
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression tests
        run: npm run test:browser
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-visual-qa
          path: artifacts/visual-qa/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7

  python-matrix:
    name: Python package / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e "python[test]"
      - name: Run Python package tests
        run: python -m pytest -q python/tests
