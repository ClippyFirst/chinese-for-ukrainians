name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run unit and integration tests
        run: npm test
      - name: Set up Python for acoustic-pipeline validation tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate acoustic measurement pipeline input guards
        run: python research/ipa-acoustic/test_measure_formants.py
      - name: Build production bundle
        run: npm run build
      - name: Verify generated mappings are committed and deterministic
        run: git diff --exit-code -- src/generated/transcription-map.js
      - name: Run conversion benchmark
        run: npm run benchmark
      - name: Check release constraints
        run: npm run check:release
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression tests
        run: npm run test:browser
