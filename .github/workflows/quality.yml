name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      # TEMPORARY: commit only the npm-resolved lockfile from this dedicated repair PR.
      - name: Commit resolved lockfile for repair
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/reproducible-npm-lockfile-2026-10-21'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp package-lock.json /tmp/resolved-package-lock.json
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          cp /tmp/resolved-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "fix: commit npm-resolved dependency lockfile"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
      - name: Run unit and integration tests
        run: npm test
      - name: Set up Python for acoustic-pipeline validation tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate acoustic measurement pipeline input guards
        run: python research/ipa-acoustic/test_measure_formants.py
      - name: Build production bundle
        run: npm run build
      - name: Verify generated mappings are committed and deterministic
        run: git diff --exit-code -- src/generated/transcription-map.js
      - name: Run conversion benchmark
        run: npm run benchmark
      - name: Check release constraints
        run: npm run check:release
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression tests
        run: npm run test:browser

      # Temporary reproducibility aid: capture the lock graph resolved by npm install
      # on the pinned CI runtime. Remove this step once package-lock.json is committed.
      - name: Export resolved npm lockfile for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
