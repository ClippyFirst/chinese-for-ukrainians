name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record dependency audit findings for disposition
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync('npm-audit-report.json','utf8')); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities ?? {}).map(([name,v])=>({name,severity:v.severity,range:v.range,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))},null,2))"
      - name: Run unit and integration tests
        run: npm test
      - name: Set up Python for acoustic-pipeline validation tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate acoustic measurement pipeline input guards
        run: python research/ipa-acoustic/test_measure_formants.py
      - name: Build production bundle
        run: npm run build
      - name: Verify generated mappings are committed and deterministic
        run: git diff --exit-code -- src/generated/transcription-map.js
      - name: Run conversion benchmark
        run: npm run benchmark
      - name: Check release constraints
        run: npm run check:release
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression tests
        run: npm run test:browser
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-visual-qa
          path: artifacts/visual-qa/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 7
