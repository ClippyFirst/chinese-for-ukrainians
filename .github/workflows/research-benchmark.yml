name: Research benchmark runner

on:
  push:
    branches:
      - research/ci-benchmark-execution-2026-10-24
    paths:
      - ".github/workflows/research-benchmark.yml"
      - "scripts/validate-benchmark-corpus.mjs"
      - "docs/audits/current/CROSS-ENGINE-BENCHMARK-CORPUS-SCHEMA-2026-10-24.csv"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
  workflow_dispatch:
    inputs:
      run_python_candidate_setup:
        description: "Run isolated candidate setup probes"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  node-baseline:
    name: Node baseline and environment manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Run project regression tests
        run: npm test
      - name: Validate benchmark corpus structure and scoring guardrails
        run: npm run validate:benchmark-corpus
      - name: Run existing latency smoke benchmark
        run: npm run benchmark | tee baseline-latency.txt
      - name: Record runtime manifest
        run: |
          node --version > environment-manifest.txt
          npm --version >> environment-manifest.txt
          python3 --version >> environment-manifest.txt
          uname -a >> environment-manifest.txt
          sha256sum package-lock.json >> environment-manifest.txt
          git rev-parse HEAD >> environment-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: node-baseline-and-manifest
          path: |
            baseline-latency.txt
            environment-manifest.txt
          if-no-files-found: error
          retention-days: 30

  python-candidate-probe:
    name: Python candidate metadata probe
    if: github.event_name != 'workflow_dispatch' || inputs.run_python_candidate_setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Record Python runtime and runner resources
        run: |
          python --version | tee python-candidate-probe.txt
          python -m pip --version >> python-candidate-probe.txt
          uname -a >> python-candidate-probe.txt
          free -h >> python-candidate-probe.txt
          df -h . >> python-candidate-probe.txt
      - name: Probe public candidate repositories
        shell: bash
        run: |
          set +e
          for repo in \
            https://github.com/GitYCC/g2pW.git \
            https://github.com/kakaobrain/g2pm.git \
            https://github.com/Kyubyong/g2pC.git \
            https://github.com/stefantaubert/pinyin-to-ipa.git
          do
            name="${repo##*/}"
            name="${name%.git}"
            echo "=== ${name} ===" | tee -a python-candidate-probe.txt
            tmp="$(mktemp -d)"
            if git clone --depth 1 "$repo" "$tmp/$name" >> python-candidate-probe.txt 2>&1; then
              echo "clone_status=PASS" | tee -a python-candidate-probe.txt
              find "$tmp/$name" -maxdepth 2 -type f \( -iname 'readme*' -o -iname 'license*' -o -name 'pyproject.toml' -o -name 'setup.py' -o -name 'requirements*.txt' -o -name 'environment*.yml' \) -print | sort | tee -a python-candidate-probe.txt
              for f in "$tmp/$name"/LICENSE "$tmp/$name"/LICENSE.txt "$tmp/$name"/pyproject.toml "$tmp/$name"/setup.py "$tmp/$name"/requirements.txt "$tmp/$name"/README.md "$tmp/$name"/readme.md; do
                if [ -f "$f" ]; then
                  echo "--- $f (first 100 lines) ---" >> python-candidate-probe.txt
                  sed -n '1,100p' "$f" >> python-candidate-probe.txt
                fi
              done
            else
              echo "clone_status=BLOCKED" | tee -a python-candidate-probe.txt
            fi
            rm -rf "$tmp"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-candidate-install-contracts
          path: python-candidate-probe.txt
          if-no-files-found: error
          retention-days: 30

  g2pc-executable-smoke:
    name: Execute lightweight g2pC smoke cases
    if: github.event_name != 'workflow_dispatch' || inputs.run_python_candidate_setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install public g2pC package in isolated runner
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --upgrade pip setuptools wheel
          # pkuseg's legacy generated C++ is not compatible with current Python/NumPy toolchains.
          python -m pip install 'numpy<2'
          python -m pip install --no-build-isolation g2pC
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: Run documented context-sensitive pronunciation examples
        if: steps.install.outputs.installed == 'true'
        run: |
          python - <<'PY' | tee g2pc-smoke-results.jsonl
          import json
          import platform
          import importlib.metadata
          from g2pc import G2pC

          engine = G2pC()
          cases = [
              {"case_id": "G2PC-DOC-001", "text": "我写了几行代码。", "target": "行", "documented_reading": "hang2"},
              {"case_id": "G2PC-DOC-002", "text": "来不了", "target": "了", "documented_reading": "liao3"},
              {"case_id": "G2PC-DOC-003", "text": "一心一意", "target": None, "documented_reading": "yi4 xin1 yi2 yi4"}
          ]
          print(json.dumps({
              "record_type": "environment",
              "python": platform.python_version(),
              "g2pC_distribution_version": importlib.metadata.version("g2pC"),
              "note": "Documented-example smoke test only; not a held-out accuracy benchmark."
          }, ensure_ascii=False))
          for case in cases:
              try:
                  output = engine(case["text"])
                  record = {
                      "record_type": "prediction",
                      **case,
                      "raw_output": output,
                      "status": "EXECUTED",
                      "scoring_status": "NOT_SCORED",
                      "reason": "Examples originate from candidate documentation and are not independent held-out gold."
                  }
              except Exception as exc:
                  record = {
                      "record_type": "prediction",
                      **case,
                      "status": "ERROR",
                      "error_type": type(exc).__name__,
                      "error": str(exc),
                      "scoring_status": "NOT_SCORED"
                  }
                  print(json.dumps(record, ensure_ascii=False))
                  raise
              print(json.dumps(record, ensure_ascii=False))
          PY
      - name: Record blocked g2pC installation
        if: steps.install.outcome == 'failure'
        run: |
          python - <<'PY' > g2pc-smoke-results.jsonl
          import json
          print(json.dumps({
              "record_type": "execution_status",
              "candidate": "g2pC",
              "status": "BLOCKED",
              "scoring_status": "NOT_SCORED",
              "reason": "Upstream pkuseg native extension failed to build in the pinned Python 3.10 runner; see job log. No substitute output was generated."
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2pc-documented-example-smoke
          path: g2pc-smoke-results.jsonl
          if-no-files-found: warn
          retention-days: 30
