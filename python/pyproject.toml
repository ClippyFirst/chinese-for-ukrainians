[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="chinese-ukrainian-transcription"
version="0.1.0"
description="Offline Chinese-to-Ukrainian transcription with an IPA-first adapter"
readme="README.md"
requires-python=">=3.10"
license="MIT"
license-files=["LICENSE"]
dependencies=["pypinyin==0.55.0"]
[project.scripts]
chuktrans="zhua:main"
[project.optional-dependencies]
test=["pytest>=8","build>=1.2","twine>=5"]
[tool.setuptools]
package-dir={""="src"}
include-package-data=true
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
zhua=["data/*.csv"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
